<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Products — Norda Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>
    <main class="admin-main">
      <div class="admin-topbar">
        <h1>Products</h1>
        <button class="btn btn-primary btn-sm" id="new-product-btn">+ New product</button>
      </div>
      <div id="alert-box"></div>
      <div id="products-root">
        <span class="spinner">Loading products…</span>
      </div>
    </main>
  </div>

  <div class="modal-overlay hidden" id="product-modal">
    <div class="modal-box">
      <h2 id="modal-title">New product</h2>
      <form id="product-form">
        <input type="hidden" id="product-id" />
        <div class="field">
          <label for="product-name">Name</label>
          <input type="text" id="product-name" required />
        </div>
        <div class="field">
          <label for="product-category">Category</label>
          <select id="product-category" required></select>
        </div>
        <div class="field">
          <label for="product-brand">Brand</label>
          <input type="text" id="product-brand" placeholder="Generic" />
        </div>
        <div class="field">
          <label for="product-price">Price ($)</label>
          <input type="number" id="product-price" min="0" step="0.01" required />
        </div>
        <div class="field">
          <label for="product-discount">Discount price ($, optional)</label>
          <input type="number" id="product-discount" min="0" step="0.01" placeholder="0" />
        </div>
        <div class="field">
          <label for="product-stock">Stock quantity</label>
          <input type="number" id="product-stock" min="0" required />
        </div>
        <div class="field">
          <label for="product-image-file">Product image</label>
          <input type="file" id="product-image-file" accept="image/*" />
          <input type="hidden" id="product-image-url" />
        </div>
        <div class="field">
          <label for="product-description">Description</label>
          <textarea id="product-description" rows="3"></textarea>
        </div>
        <div class="field">
          <label><input type="checkbox" id="product-featured" style="width:auto;display:inline-block;margin-right:8px;" />Feature this product on the homepage</label>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-outline btn-sm" id="cancel-product-btn">Cancel</button>
          <button type="submit" class="btn btn-primary btn-sm" id="save-product-btn">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/products-render.js"></script>
  <script src="admin-layout.js"></script>
  <script src="products.js"></script>
</body>
</html>
